        driverClassName: com.mysql.cj.jdbc.Driver
        url: jdbc:mysql://127.0.0.1:3306/huochpiaodingpiao?useUnicode=true&characterEncoding=utf-8&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=GMT%2B8
        username: root
        password: liuboyu360502


    servlet:
      multipart:
        max-file-size: 1000MB
        max-request-size: 1000MB
    resources:
